name: Export working tree

on:
  push:
    branches:
      - architect/region-content-544-story

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: |
          tar --exclude=.git --exclude=node_modules -czf samosbor-working-tree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: samosbor-working-tree
          path: samosbor-working-tree.tar.gz
          retention-days: 1
