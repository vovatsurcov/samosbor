name: Integrate region 549-545

on:
  push:
    branches:
      - architect/region-549-545
    paths:
      - app/game-region-549-545.ts
      - tests/region-549-545.test.mjs
      - scripts/apply-region-549-545.py
      - .github/workflows/architect-region-549-545.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'architect/region-549-545' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply exact integration patch
        run: python3 scripts/apply-region-549-545.py

      - name: Remove integration-only imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/game-engine.ts")
          text = path.read_text(encoding="utf-8")
          old = '''import {
            FLOOR_545_MAP,
            FLOOR_546_MAP,
            FLOOR_547_MAP,
            FLOOR_548_MAP,
            FLOOR_549_MAP,
            REGION_CONTAINER_CONTENTS,
            REGION_ENEMIES,
            REGION_MAPS,
            REGION_NPC_MESSAGES,
            REGION_OBJECTIVES,
            REGION_POPULATIONS,
            REGION_SAFE_ZONES,
            REGION_STARTS,
            REGION_TERMINAL_MESSAGES,
            REGION_TRANSITIONS,
            type RegionZoneId,
          } from "./game-region-549-545.ts";'''
          new = '''import {
            REGION_CONTAINER_CONTENTS,
            REGION_ENEMIES,
            REGION_MAPS,
            REGION_NPC_MESSAGES,
            REGION_OBJECTIVES,
            REGION_POPULATIONS,
            REGION_SAFE_ZONES,
            REGION_STARTS,
            REGION_TERMINAL_MESSAGES,
            REGION_TRANSITIONS,
            type RegionZoneId,
          } from "./game-region-549-545.ts";'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript syntax
        run: |
          node --experimental-strip-types --check app/game-region-549-545.ts
          node --experimental-strip-types --check app/game-engine.ts

      - name: Run engine tests
        run: npm run test:engine

      - name: Run lint
        run: npm run lint

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit verified cleanup
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "samosbor-architect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/game-engine.ts package.json
          git commit -m "Clean region integration imports"
          git push origin HEAD:architect/region-549-545
