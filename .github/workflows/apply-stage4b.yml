name: Apply Stage 4B

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stage4b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Stage 4B patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/stage4b/part-*.patch > /tmp/stage4b.patch
          git apply --check /tmp/stage4b.patch
          git apply /tmp/stage4b.patch
          rm -rf .automation/stage4b .github/workflows/apply-stage4b.yml
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Simulate persistent genomic populations"
          git push origin HEAD:main
