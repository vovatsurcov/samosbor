name: Export approved PR state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tmp/export-approved-state'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: tar --exclude=.git --exclude=node_modules -czf samosbor-approved-state.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: samosbor-approved-state
          path: samosbor-approved-state.tar.gz
          retention-days: 1
