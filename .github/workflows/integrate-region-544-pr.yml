name: Integrate region 544 pull request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'architect/region-content-544-story'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply integration changes
        run: node scripts/run-region-content-544.mjs

      - name: Run engine tests
        run: npm run test:engine

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit integrated region
        run: |
          git config user.name "Samosbor Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Expand Dry Dock region and lower settlement"
          git push origin HEAD:${{ github.head_ref }}
