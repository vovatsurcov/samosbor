name: Apply approved campaign

on:
  push:
    branches:
      - architect/approved-campaign-floors-534
    paths:
      - '.automation/approved-campaign/**'
      - '.github/workflows/apply-approved-campaign.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: hashFiles('.automation/approved-campaign/result.log') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/approved-campaign-floors-534
          fetch-depth: 0

      - name: Assemble approved payload
        run: |
          cat .automation/approved-campaign/part-* > /tmp/approved-campaign.b64
          base64 --decode /tmp/approved-campaign.b64 > /tmp/approved-campaign.tar.gz
          echo 'a0683cc072eb5a9618f39d5155f9c59b55d04d811cc18923720337f1068f5a54  /tmp/approved-campaign.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/approved-campaign.tar.gz -C .

      - name: Verify engine lint and build
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/verification.log
          npm ci >> /tmp/verification.log 2>&1
          install_status=$?
          engine_status=99
          lint_status=99
          build_status=99
          if [ "$install_status" -eq 0 ]; then
            npm run test:engine >> /tmp/verification.log 2>&1
            engine_status=$?
          fi
          if [ "$engine_status" -eq 0 ]; then
            npm run lint >> /tmp/verification.log 2>&1
            lint_status=$?
          fi
          if [ "$lint_status" -eq 0 ]; then
            npm run build >> /tmp/verification.log 2>&1
            build_status=$?
          fi
          {
            echo "install=$install_status"
            echo "engine=$engine_status"
            echo "lint=$lint_status"
            echo "build=$build_status"
            echo
            cat /tmp/verification.log
          } > .automation/approved-campaign/result.log
          if [ "$install_status" -eq 0 ] && [ "$engine_status" -eq 0 ] && [ "$lint_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            touch .automation/approved-campaign/success
          fi
          exit 0

      - name: Commit verified result
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          if [ -f .automation/approved-campaign/success ]; then
            git rm -r .automation/approved-campaign
            git rm .github/workflows/apply-approved-campaign.yml
            git add README.md package.json app docs tests
            git commit -m 'Implement approved campaign through floor 534'
          else
            git add .automation/approved-campaign/result.log
            git commit -m 'Record approved campaign verification failure'
          fi
          git push origin HEAD:architect/approved-campaign-floors-534
