name: Apply Stage 4A

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stage4a.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Stage 4A patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/stage4a/part-*.patch > /tmp/stage4a.patch
          git apply --check /tmp/stage4a.patch
          git apply /tmp/stage4a.patch
          rm -rf .automation/stage4a .github/workflows/apply-stage4a.yml
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Add connected floors and direct transitions"
          git push origin HEAD:main
