name: Apply starter floor expansion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .automation/starter-floors/part-*.patch > /tmp/starter-floors.patch
          git apply --check /tmp/starter-floors.patch
          git apply /tmp/starter-floors.patch
          node --experimental-strip-types --test tests/game-engine.test.mjs

      - name: Commit verified game changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git rm -r .automation/starter-floors
          git add app/game-engine.ts app/game-prototype.tsx app/globals.css tests/game-engine.test.mjs
          git commit -m "Expand starter floors and require explicit transitions"
          git push origin HEAD:main
