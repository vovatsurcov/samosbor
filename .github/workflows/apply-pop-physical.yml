name: Apply physical population patch

on:
  push:
    branches: [main]
    paths:
      - '.automation/pop-physical/**'
      - '.github/workflows/apply-pop-physical.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and apply patch
        run: |
          cat .automation/pop-physical/part-*.patch > /tmp/pop-physical.patch
          git apply --check /tmp/pop-physical.patch
          git apply /tmp/pop-physical.patch
          rm -rf .automation/pop-physical
          rm .github/workflows/apply-pop-physical.yml
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Manifest genomic populations in the physical world"
          git push origin HEAD:main
