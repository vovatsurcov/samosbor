name: Apply approved campaign PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.head_ref == 'architect/approved-campaign-floors-534'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/approved-campaign-floors-534
          fetch-depth: 0

      - name: Assemble payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .automation/approved-campaign
          compgen -G '.automation/approved-campaign/part-*' > /dev/null
          rm -f .automation/approved-campaign/result.log .automation/approved-campaign/success
          cat .automation/approved-campaign/part-* > /tmp/approved-campaign.b64
          base64 --decode /tmp/approved-campaign.b64 > /tmp/approved-campaign.tar.gz
          sha256sum /tmp/approved-campaign.tar.gz
          gzip -t /tmp/approved-campaign.tar.gz
          tar -tzf /tmp/approved-campaign.tar.gz | tee /tmp/approved-campaign-files.txt
          grep -q '^app/' /tmp/approved-campaign-files.txt
          grep -q '^tests/' /tmp/approved-campaign-files.txt
          tar -xzf /tmp/approved-campaign.tar.gz -C .

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm run test:engine

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit approved implementation
        shell: bash
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git rm -r .automation/approved-campaign
          git rm -f .github/workflows/apply-approved-campaign.yml || true
          git add README.md package.json app docs tests
          git commit -m 'Implement approved campaign through floor 534'
          git push origin HEAD:architect/approved-campaign-floors-534
